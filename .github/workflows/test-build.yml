# Based on sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Test Compile & Jekyll Build

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
            persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
        env:
          BUNDLE_GEMFILE: docs/Gemfile
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build content from yaml
        run:  cd cmd && go run . compile --output ../docs/versions/devel.md --checklist-output ../docs/versions/devel-checklist.md --crosswalk-output ../docs/versions/devel-crosswalk.md
      - name: Build with Jekyll
        run: cd docs && bundle exec jekyll build