title: OSPS Baseline to NIS2 Directive Mapping
metadata:
  id: osps-baseline-to-nis2
  type: MappingDocument
  gemara-version: "1.2.0"
  description: |
    Cross-walk from the Open Source Project Security (OSPS) Baseline
    controls to the cybersecurity risk-management measures in Article 21(2)
    of the NIS2 Directive. Only the measures in the directive are mapped,
    not national transpositions. Each mapping asserts a "relates-to"
    relationship; strength, confidence-level, and rationale are left
    unset and should be added as the mappings are individually
    reviewed.
  draft: true
  author:
    id: openssf
    name: OSPS Baseline Authors
    type: Human
  mapping-references:
    - id: osps-baseline
      title: Open Source Project Security Baseline
      version: "draft"
      url: https://github.com/ossf/security-baseline
      description: |
        The Open Source Project Security (OSPS) Baseline is a set of security
        criteria that projects should meet to demonstrate a strong security
        posture.
    - id: NIS2
      title: NIS2 Directive
      version: "2022-12-14"
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555
      description: Directive (EU) 2022/2555 of the European Parliament and of the Council of 14 December 2022 on measures for a high common level of cybersecurity across the Union (NIS 2 Directive)
source-reference:
  reference-id: osps-baseline
  entry-type: Control
target-reference:
  reference-id: NIS2
  entry-type: Guideline
